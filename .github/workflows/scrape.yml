name: Scrape and Report

on:
  schedule:
    # Dispatch latency here depends on time of day, not on the minute. Measured
    # over 1-4 Sep: the 13:43 slot ran +33m, +8m, +8m, +2m, while 09:43 ran
    # +7h43m, +7h36m, +7h28m, +7h21m. The shape is consistent with European
    # morning congestion, which would also explain why the old 10:00 slot ran
    # 9-53 min late through 26 Aug and then jumped to 3.5-11 hours.
    #
    # 09:43 is known bad and 13:43 known good, so the primary probes the
    # midpoint to find the edge. The backstop stays fixed: it delivers on time
    # regardless, so a failed probe costs nothing. Move the primary only, and
    # only after a few days of evidence.
    - cron: '43 11 * * *'  # 7:43 AM EDT / 6:43 AM EST (probe)
    - cron: '43 13 * * *'  # 9:43 AM EDT / 8:43 AM EST (backstop, known good)
  workflow_dispatch:      # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape NIST MIP list
        run: python scrape_nist_mip.py

      - name: Generate HTML report
        run: python generate_report.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nist_modules_in_process.db index.html miplist-stats.html
          git diff --staged --quiet || git commit -m "Update database and report [$(date -u '+%Y-%m-%d')]"
          git pull --rebase
          git push
