name: Scrape and Report

on:
  schedule:
    # Do not bother retuning these times. Dispatch latency here is a per-day
    # queue delay applied to every slot alike, not a property of the time of
    # day. Measured 1-8 Sep, both slots drifted together: ~4h on 1-4 Sep,
    # ~2h40m over the weekend, +4h56m/+4h40m on the 7th, +3h35m/+3h46m on the
    # 8th. The tell is that the gap between the two daily runs tracks the gap
    # between the two slots -- it collapsed from ~3h20m to ~1h50m the moment
    # the slots moved from 4 hours apart to 2. An earlier reading that 13:43
    # was a "fast slot" fitted four days and then broke; this one fits eight.
    #
    # Slots stay 4 hours apart so the two runs remain far enough apart to tell
    # which is which: GitHub's API does not expose the triggering cron.
    # A guaranteed time needs an external trigger (workflow_dispatch starts in
    # seconds) or a real cron elsewhere -- not a different schedule here.
    - cron: '43 9 * * *'   # 5:43 AM EDT / 4:43 AM EST
    - cron: '43 13 * * *'  # 9:43 AM EDT / 8:43 AM EST (backstop)
  workflow_dispatch:      # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape NIST MIP list
        run: python scrape_nist_mip.py

      - name: Generate HTML report
        run: python generate_report.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nist_modules_in_process.db index.html miplist-stats.html
          git diff --staged --quiet || git commit -m "Update database and report [$(date -u '+%Y-%m-%d')]"
          git pull --rebase
          git push
