name: Scrape and Report

on:
  schedule:
    # GitHub queues scheduled events best-effort and minute :00 is the most
    # oversubscribed slot, so both times sit off the hour. The second run is a
    # backstop for days the first is badly delayed; the scraper replaces the
    # current publish date, so a same-day re-run is a no-op that commits nothing.
    - cron: '43 9 * * *'   # 5:43 AM EDT / 4:43 AM EST
    - cron: '43 13 * * *'  # 9:43 AM EDT / 8:43 AM EST (backstop)
  workflow_dispatch:      # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape NIST MIP list
        run: python scrape_nist_mip.py

      - name: Generate HTML report
        run: python generate_report.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nist_modules_in_process.db index.html miplist-stats.html
          git diff --staged --quiet || git commit -m "Update database and report [$(date -u '+%Y-%m-%d')]"
          git pull --rebase
          git push
